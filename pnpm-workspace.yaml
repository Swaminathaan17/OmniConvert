minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

# pnpm 11 replaced `onlyBuiltDependencies` with the `allowBuilds` map; the old
# key is now silently ignored and `strictDepBuilds` defaults to true, so an
# install fails with ERR_PNPM_IGNORED_BUILDS unless each reviewed build script
# is explicitly approved here. These are the same four packages that were
# approved previously; every other dependency's build scripts stay disallowed.
allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  unrs-resolver: true

overrides:
  # Native/platform binaries (esbuild, lightningcss, @tailwindcss/oxide, rollup)
  # are optional dependencies that pnpm resolves automatically for the platform
  # running the install. They must NOT be pinned to a single platform here:
  # excluding e.g. the win32-x64 variants makes the lockfile non-portable and
  # breaks `vite build` on Windows with "Cannot find module
  # @rollup/rollup-win32-x64-msvc". Leaving the default behaviour lets pnpm
  # install the correct native binary on Windows x64 and Linux x64 alike.
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.2"
  # orval pins js-yaml to an exact version older than the CVE fix (>=4.3.2)
  js-yaml: '4.3.2'
