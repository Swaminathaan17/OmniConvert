openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: currency
    description: Exchange-rate operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /currency/rates:
    get:
      operationId: getCurrencyRates
      tags: [currency]
      summary: Get current exchange rates
      description: Returns current exchange rates from the configured live provider, including provider update time and stale-cache status.
      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
            enum: [INR, USD, EUR, GBP, JPY, CNY, AED, SAR, SGD, AUD, CAD, CHF, HKD, KRW, BDT]
        - name: refresh
          in: query
          required: false
          description: Bypass the fresh server cache and request an update from the provider.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Exchange rates returned by the live provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyRatesResponse"
        "400":
          description: Unsupported base currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Exchange-rate provider is unavailable and no cached rates are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrencyRatesResponse:
      type: object
      properties:
        baseCode:
          type: string
        rates:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string
          format: date-time
        fetchedAt:
          type: string
          format: date-time
        provider:
          type: string
        stale:
          type: boolean
      required: [baseCode, rates, updatedAt, fetchedAt, provider, stale]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

